<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Dynasty Gifts</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090c13;
      color: #fff;
      margin: 0;
      padding: 14px 14px 80px 14px;
      text-align: center;
      user-select: none;
    }
    .header-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #d4af37;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .card {
      background: #131822;
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 14px;
      border: 1px solid #202736;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      text-align: left;
    }
    .balance-val {
      font-size: 32px;
      font-weight: 800;
      color: #ffd700;
      margin-top: 4px;
    }

    /* Список кейсов */
    .case-card {
      background: #141b26;
      border: 1px solid #243044;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .case-card::after {
      content: "";
      position: absolute;
      top: -30px;
      right: -30px;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(212,175,55,0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .case-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .case-price {
      color: #ffd700;
      font-weight: 800;
      font-size: 15px;
    }
    .chances-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 10px 0;
      font-size: 11px;
    }
    .chance-tag {
      background: #1a2230;
      border: 1px solid #27344a;
      border-radius: 6px;
      padding: 3px 6px;
      color: #a0aec0;
    }
    .chance-tag.gold { color: #f6c026; border-color: rgba(246,192,38,0.3); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      background: #2ea6ff;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.97); }
    .btn-gold { background: linear-gradient(90deg, #d4af37, #b28912); color: #000; font-weight: 800; }
    .btn-demo { background: #263345; color: #a4b3c7; }

    /* Модалка с рулеткой */
    .roulette-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 2000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .roulette-modal.show { display: flex; }
    .roulette-container {
      width: 100%;
      max-width: 380px;
      background: #121722;
      border: 2px solid #d4af37;
      border-radius: 20px;
      padding: 20px 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(212,175,55,0.25);
    }
    .center-pointer {
      position: absolute;
      top: 55px;
      bottom: 60px;
      left: 50%;
      width: 4px;
      background: #ffd700;
      transform: translateX(-50%);
      z-index: 10;
      box-shadow: 0 0 10px #ffd700;
    }
    .center-pointer::before {
      content: "▼";
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffd700;
      font-size: 14px;
    }
    .tape-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      margin: 25px 0;
      border-radius: 12px;
      background: #090c13;
      border: 1px solid #1f2736;
    }
    .tape-track {
      display: flex;
      transform: translateX(0px);
      transition: none;
    }
    .item-card {
      min-width: 110px;
      height: 125px;
      background: #141b27;
      margin: 6px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #263347;
      font-size: 11px;
    }
    .item-card img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      margin-bottom: 6px;
    }
    .item-card .name { font-weight: 700; color: #e2e8f0; }
    .item-card .stars-badge { color: #f59e0b; font-weight: bold; font-size: 10px; }

    /* Нижние вкладки */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #0f131c;
      border-top: 1px solid #1f2736;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }
    .tab-btn {
      background: none;
      border: none;
      color: #6d7b8d;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      cursor: pointer;
    }
    .tab-btn.active { color: #d4af37; font-weight: bold; }
    .tab-btn span { font-size: 18px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="header-title">Dynasty Gifts</div>

  <!-- ВКЛАДКА 1: КЕЙСЫ -->
  <div id="tab-cases" class="tab-content active">
    <div class="card" style="text-align: center;">
      <div style="font-size: 12px; color: #8292a8;">Баланс аккаунта</div>
      <div class="balance-val"><span id="balance">0</span> ⭐</div>
      <button style="margin-top: 10px;" onclick="claimDaily()">🎁 Забрать бонус (2-5 ⭐ раз в день)</button>
    </div>

    <!-- Список из 5 кейсов -->
    <div id="cases-container"></div>
  </div>

  <!-- ВКЛАДКА 2: ЗАДАНИЯ NFT -->
  <div id="tab-nft" class="tab-content">
    <div class="card">
      <div style="background: rgba(212,175,55,0.15); color: #d4af37; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block;">АКЦИЯ В TIKTOK</div>
      <h3 style="margin: 8px 0;">Бесплатный Telegram NFT</h3>
      <p style="font-size: 13px; color: #8e9ba8;">Оставь комментарии под 30 видео в TikTok со словами @DynastyGiftBot, пролайкай отзывы и отправь скриншоты модератору.</p>
      <a href="https://t.me/alisamoderator" target="_blank" style="text-decoration: none;">
        <button class="btn-gold" style="width: 100%; margin-top: 10px;">Отправить скриншоты (@alisamoderator)</button>
      </a>
    </div>
  </div>

  <!-- МОДАЛКА РУЛЕТКИ -->
  <div id="rouletteModal" class="roulette-modal">
    <div class="roulette-container">
      <h3 id="modalTitle" style="margin: 0; color: #ffd700;">Открытие кейса</h3>
      <div class="center-pointer"></div>
      <div class="tape-wrapper">
        <div id="tapeTrack" class="tape-track"></div>
      </div>
      <div id="spinResult" style="min-height: 22px; font-weight: bold; margin-bottom: 12px; font-size: 15px; color: #fff;"></div>
      <button id="closeSpinBtn" class="btn-gold" style="display: none; width: 100%;" onclick="closeRoulette()">Забрать приз</button>
    </div>
  </div>

  <!-- ТАБ-БАР -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('cases', this)">
      <span>📦</span>
      Кейсы
    </button>
    <button class="tab-btn" onclick="switchTab('nft', this)">
      <span>💎</span>
      Бесплатный NFT
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const API_URL = 'https://dynasty-github-io.onrender.com/api';
    const userId = tg?.initDataUnsafe?.user?.id || 'demo_user';

    // База предметов из твоих скриншотов на чистом темно-прозрачном фоне
    const ITEMS = {
      pepe: { name: 'Plush Pepe', img: 'https://cdn-icons-png.flaticon.com/512/10398/10398553.png', stars: '20 000 ⭐' },
      cupid: { name: 'Cupid Charm', img: 'https://cdn-icons-png.flaticon.com/512/833/833472.png', stars: '150 ⭐' },
      calendar: { name: 'Desk Calendar', img: 'https://cdn-icons-png.flaticon.com/512/5968/5968434.png', stars: '90 ⭐' },
      ring: { name: 'Diamond Ring', img: 'https://cdn-icons-png.flaticon.com/512/263/263100.png', stars: '100 ⭐' },
      gift: { name: 'Подарочек', img: 'https://cdn-icons-png.flaticon.com/512/4213/4213958.png', stars: '25 ⭐' }
    };

    // 5 кейсов с визуальными шансами
    const CASES = [
      {
        price: 100,
        title: 'Стартовый Кейс',
        chances: [
          { text: 'Подарочек 30%' }, { text: 'Кольцо 30%' }, { text: 'Календарь 20%' }, { text: 'Купидон 15%' }, { text: 'Пепе 5%', gold: true }
        ]
      },
      {
        price: 300,
        title: 'Бронзовый Кейс',
        chances: [
          { text: 'Подарочек 20%' }, { text: 'Кольцо 25%' }, { text: 'Календарь 25%' }, { text: 'Купидон 20%' }, { text: 'Пепе 10%', gold: true }
        ]
      },
      {
        price: 500,
        title: 'Серебряный Кейс',
        chances: [
          { text: 'Подарочек 10%' }, { text: 'Кольцо 20%' }, { text: 'Календарь 30%' }, { text: 'Купидон 25%' }, { text: 'Пепе 15%', gold: true }
        ]
      },
      {
        price: 750,
        title: 'Золотой Кейс',
        chances: [
          { text: 'Подарочек 5%' }, { text: 'Кольцо 15%' }, { text: 'Календарь 30%' }, { text: 'Купидон 30%' }, { text: 'Пепе 20%', gold: true }
        ]
      },
      {
        price: 1000,
        title: 'Dynasty VIP Box',
        chances: [
          { text: 'Подарочек 2%' }, { text: 'Кольцо 8%' }, { text: 'Календарь 25%' }, { text: 'Купидон 35%' }, { text: 'Пепе 30%', gold: true }
        ]
      }
    ];

    // Рендер кейсов
    function renderCases() {
      const container = document.getElementById('cases-container');
      container.innerHTML = CASES.map(c => `
        <div class="case-card">
          <div class="case-title">
            <span>${c.title}</span>
            <span class="case-price">${c.price} ⭐</span>
          </div>
          <div class="chances-list">
            ${c.chances.map(ch => `<div class="chance-tag ${ch.gold ? 'gold' : ''}">${ch.text}</div>`).join('')}
          </div>
          <div class="btn-row">
            <button class="btn-demo" onclick="spinCase(${c.price}, true)">Демо прокрут</button>
            <button class="btn-gold" onclick="spinCase(${c.price}, false)">Открыть за ${c.price} ⭐</button>
          </div>
        </div>
      `).join('');
    }

    // Логика рулетки
    let isSpinning = false;
    async function spinCase(price, isDemo) {
      if (isSpinning) return;

      let rewardStars = Math.floor(Math.random() * 4) + 2; // 2-5 звезд

      if (!isDemo) {
        try {
          const res = await fetch(`${API_URL}/open-case`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tg_id: userId, price: price })
          });
          const data = await res.json();
          if (!data.success) {
            alert(data.error);
            return;
          }
          rewardStars = data.rewardStars;
          document.getElementById('balance').innerText = data.newBalance;
        } catch (e) {
          alert('Ошибка сервера');
          return;
        }
      }

      isSpinning = true;
      const modal = document.getElementById('rouletteModal');
      const track = document.getElementById('tapeTrack');
      const resText = document.getElementById('spinResult');
      const closeBtn = document.getElementById('closeSpinBtn');

      document.getElementById('modalTitle').innerText = isDemo ? 'Демо прокрутка' : `Кейс ${price} ⭐`;
      resText.innerText = 'Крутим рулетку...';
      closeBtn.style.display = 'none';
      modal.classList.add('show');

      // Генерируем ленту из 60 карточек
      const pool = [ITEMS.pepe, ITEMS.cupid, ITEMS.calendar, ITEMS.ring, ITEMS.gift];
      let tapeHTML = '';
      for (let i = 0; i < 60; i++) {
        const item = pool[Math.floor(Math.random() * pool.length)];
        tapeHTML += `
          <div class="item-card">
            <img src="${item.img}" />
            <div class="name">${item.name}</div>
            <div class="stars-badge">${item.stars}</div>
          </div>
        `;
      }
      track.innerHTML = tapeHTML;

      // Сброс позиции
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';

      // Запуск плавной анимации остановки
      setTimeout(() => {
        const cardWidth = 122; // карточка + margin
        const stopIndex = 48;  // останавливаемся на 48-й карточке
        // Смещаем чуть левее центра указателя, создавая эффект «почти выпал Pepe!»
        const targetOffset = -(stopIndex * cardWidth - 110);

        track.style.transition = 'transform 5.5s cubic-bezier(0.12, 0.8, 0.2, 1)';
        track.style.transform = `translateX(${targetOffset}px)`;
      }, 50);

      // Окончание прокрутки
      setTimeout(() => {
        isSpinning = false;
        resText.innerText = isDemo 
          ? `(Демо) Вы получили: +${rewardStars} ⭐ (Утешительный приз)` 
          : `Вы получили: +${rewardStars} ⭐ (Утешительный приз)`;
        closeBtn.style.display = 'block';
      }, 5800);
    }

    function closeRoulette() {
      document.getElementById('rouletteModal').classList.remove('show');
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${tabId}`).classList.add('active');
      el.classList.add('active');
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}/user/${userId}`);
        const data = await res.json();
        document.getElementById('balance').innerText = data.balance;
      } catch (e) {}
    }

    async function claimDaily() {
      try {
        const res = await fetch(`${API_URL}/claim-daily`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tg_id: userId })
        });
        const data = await res.json();
        if (data.success) {
          alert(`Ты получил: +${data.reward} ⭐`);
          document.getElementById('balance').innerText = data.newBalance;
        } else {
          alert(data.error);
        }
      } catch (e) {
        alert('Сервер недоступен');
      }
    }

    renderCases();
    loadData();
  </script>
</body>
</html>
